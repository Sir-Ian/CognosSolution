title: Cognos Solution LLC
description: Independent software, useful tools, and ideas put into practice by Cognos Solution LLC.
url: https://cognossolution.com
baseurl: ""

theme: minima

# Basic site options
locale: en-US
markdown: kramdown
permalink: /:categories/:title/

# Author profile
author: Ian Deuberry

minima:
  social_links:
    github: Sir-Ian
    linkedin: an-deuberry

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate

# Keep archived drafts and development files out of the public site.
exclude:
  - archive
  - index.html.new
  - Gemfile
  - Gemfile.lock
  - README.md
